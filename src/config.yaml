site:
  name: Grit + Grace Doula
  site: 'https://theggdoula.vercel.app'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: Grit + Grace Doula | Birth & Postpartum Support
    template: '%s — Grit + Grace Doula'
  description: Compassionate prenatal, birth, postpartum, breastfeeding, and newborn-care support from Grit + Grace Doula.
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Grit + Grace Doula
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 4

    post:
      isEnabled: true
      permalink: '/resources/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'resources/blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'resources/blog/category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'resources/blog/tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Follow the system preference; users can choose light or dark mode.
